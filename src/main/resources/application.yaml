spring:
  application:
    name: interview-copilot_internal-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # iss is validated against the public issuer; keys are fetched over the internal URL.
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/interview-copilot}
          jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8081/realms/interview-copilot/protocol/openid-connect/certs}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: backend-api
              uri: ${BACKEND_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8080}
